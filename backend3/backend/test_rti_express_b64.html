        :root {
            --primary-color: #1d70b8;
            --accent-color: #1d70b8;
            --bg-color: #FFFFFF;
            --paper-color: #FFFFFF;
            --text-color: #000000;
            --border-color: #333333;
            
            
                --font-family-chosen: 'Merriweather', serif;
            
        }

        /* ── Complete Unicode Indic script fallback stack ─────────────────
           The font-family chosen by the user (Playfair, Merriweather, etc.)
           is used for Latin characters. For each Indic script the matching
           Noto font is prepended via a per-language body class below so that
           Chromium always has the correct glyph table and never shows bars. */
        --noto-indic-fallbacks:
            'Noto Serif Telugu',  'Noto Sans Telugu',
            'Noto Serif Devanagari', 'Noto Sans Devanagari',
            'Noto Serif Kannada',  'Noto Sans Kannada',
            'Noto Serif Malayalam','Noto Sans Malayalam',
            'Noto Serif Tamil',   'Noto Sans Tamil',
            'Noto Serif Bengali', 'Noto Sans Bengali',
            'Noto Serif Gujarati','Noto Sans Gujarati',
            'Noto Serif Gurmukhi','Noto Sans Gurmukhi',
            'Noto Serif Oriya',   'Noto Sans Oriya';

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            /* Latin chosen font + ALL Indic Noto fallbacks so every script renders */
            font-family: var(--font-family-chosen),
                         'Noto Serif Telugu',  'Noto Sans Telugu',
                         'Noto Serif Devanagari', 'Noto Sans Devanagari',
                         'Noto Serif Kannada',  'Noto Sans Kannada',
                         'Noto Serif Malayalam','Noto Sans Malayalam',
                         'Noto Serif Tamil',   'Noto Sans Tamil',
                         'Noto Serif Bengali', 'Noto Sans Bengali',
                         'Noto Serif Gujarati','Noto Sans Gujarati',
                         'Noto Serif Gurmukhi','Noto Sans Gurmukhi',
                         'Noto Serif Oriya',   'Noto Sans Oriya',
                         serif;
            margin: 0;
            padding: 40px;
            width: 1120px; /* Broadsheet width */
            box-sizing: border-box;
        }

        /* ── Per-language body font injection ────────────────────────────
           Each language class puts the primary script font FIRST in the
           family list so Chromium uses it for all glyphs in that script
           instead of falling back to a tofu/bar glyph. */
        body[lang="te"] { font-family: 'Noto Serif Telugu', 'Noto Sans Telugu', var(--font-family-chosen), serif; }
        body[lang="hi"] { font-family: 'Noto Serif Devanagari', 'Noto Sans Devanagari', var(--font-family-chosen), serif; }
        body[lang="mr"] { font-family: 'Noto Serif Devanagari', 'Noto Sans Devanagari', var(--font-family-chosen), serif; }
        body[lang="kn"] { font-family: 'Noto Serif Kannada',   'Noto Sans Kannada',   var(--font-family-chosen), serif; }
        body[lang="ml"] { font-family: 'Noto Serif Malayalam', 'Noto Sans Malayalam', var(--font-family-chosen), serif; }
        body[lang="ta"] { font-family: 'Noto Serif Tamil',     'Noto Sans Tamil',     var(--font-family-chosen), serif; }
        body[lang="bn"] { font-family: 'Noto Serif Bengali',   'Noto Sans Bengali',   var(--font-family-chosen), serif; }
        body[lang="gu"] { font-family: 'Noto Serif Gujarati',  'Noto Sans Gujarati',  var(--font-family-chosen), serif; }
        body[lang="pa"] { font-family: 'Noto Serif Gurmukhi',  'Noto Sans Gurmukhi',  var(--font-family-chosen), serif; }
        body[lang="or"] { font-family: 'Noto Serif Oriya',     'Noto Sans Oriya',     var(--font-family-chosen), serif; }

        .newspaper-container {
            border: 1px solid var(--border-color);
            padding: 2px;
            background-color: var(--bg-color);
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            height: auto;
            min-height: 600px;
        }

        .inner-border {
            border: 2px solid var(--border-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        /* Masthead Section */
        .masthead {
            text-align: center;
            border-bottom: 4px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 5px;
        }

        .logo-img {
            max-width: 800px;
            max-height: 120px;
            object-fit: contain;
        }

        .fallback-masthead {
            font-family: 'Playfair Display', serif;
            font-size: 80px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
            line-height: 1;
            color: var(--primary-color);
        }

        /* Metadata Bar */
        .metadata-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            border-bottom: 2px solid var(--border-color);
            padding: 5px 0;
            margin-bottom: 30px;
            font-family: 'Playfair Display', sans-serif;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
        }

        /* Main Content */
        .headline {
            /* Headline: Latin display font + every Indic script Noto as fallback */
            font-family: 'Playfair Display',
                         'Noto Serif Telugu',  'Noto Sans Telugu',
                         'Noto Serif Devanagari', 'Noto Sans Devanagari',
                         'Noto Serif Kannada',  'Noto Sans Kannada',
                         'Noto Serif Malayalam','Noto Sans Malayalam',
                         'Noto Serif Tamil',   'Noto Sans Tamil',
                         'Noto Serif Bengali', 'Noto Sans Bengali',
                         'Noto Serif Gujarati','Noto Sans Gujarati',
                         'Noto Serif Gurmukhi','Noto Sans Gurmukhi',
                         'Noto Serif Oriya',   'Noto Sans Oriya',
                         serif;
            font-size: 56px;
            font-weight: 900;
            line-height: 1.1;
            text-align: center;
            margin: 0 0 15px 0;
            color: var(--primary-color, #111111);
        }

        .subtitle {
            /* Subtitle: same complete fallback stack */
            font-family: 'Merriweather',
                         'Noto Serif Telugu',  'Noto Sans Telugu',
                         'Noto Serif Devanagari', 'Noto Sans Devanagari',
                         'Noto Serif Kannada',  'Noto Sans Kannada',
                         'Noto Serif Malayalam','Noto Sans Malayalam',
                         'Noto Serif Tamil',   'Noto Sans Tamil',
                         'Noto Serif Bengali', 'Noto Sans Bengali',
                         'Noto Serif Gujarati','Noto Sans Gujarati',
                         'Noto Serif Gurmukhi','Noto Sans Gurmukhi',
                         'Noto Serif Oriya',   'Noto Sans Oriya',
                         serif;
            font-size: 24px;
            font-style: italic;
            text-align: center;
            margin: 0 0 30px 0;
            color: #444;
        }

        .article-meta {
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
        }
        
        .article-meta span {
            color: var(--primary-color);
        }

        .content-wrapper {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .featured-image-container {
            grid-column: 1 / -1; /* Span all columns */
            margin-bottom: 12px;
            display: grid;
            gap: 15px;
            width: 100%;
        }

        .featured-image-container.images-1 {
            grid-template-columns: 1fr;
        }

        .featured-image-container.images-2 {
            grid-template-columns: 1fr 1fr;
        }

        .featured-image-container.images-3 {
            grid-template-columns: 1.5fr 1fr;
        }

        .featured-image-container.images-3-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            grid-gap: 15px;
        }
        
        .images-3-side {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            height: 100%;
        }

        .images-3-side .featured-image {
            width: 100%;
            height: calc(50% - 7.5px);
            object-fit: contain;
            object-position: center top;
        }

        .featured-image {
            display: block;
            max-width: 100%;
            max-height: 900px;
            height: auto;
            width: auto;
            margin: 0 auto;
            object-fit: contain;
            object-position: center top;
            border: 1px solid var(--border-color);
            filter: none !important;
            image-rendering: auto !important;
            image-rendering: smooth !important;
        }

        .featured-image-container.images-1 .featured-image {
            max-height: 900px;
            height: auto;
            width: auto;
            object-fit: contain;
        }

        /* Column Content */
        .article-body {
            grid-column: 1 / -1;
            columns: 3;
            column-gap: 20px;
            column-rule: 1px solid #ccc;
        }

        .article-body p {
            font-size: 16px;
            line-height: 1.45;
            margin-top: 0;
            margin-bottom: 8px;
            text-align: justify;
        }

        .article-body p:first-of-type::first-letter {
            font-family: 'Playfair Display', serif;
            font-size: 60px;
            float: left;
            line-height: 0.8;
            padding-right: 8px;
            color: var(--primary-color);
        }

        /* Footer */
        .footer {
            border-top: 2px solid var(--border-color);
            margin-top: auto;
            padding-top: 15px;
            display: flex;
            justify-content: space-between;
            font-family: 'Playfair Display', sans-serif;
            font-size: 12px;
            font-weight: bold;
            color: #666;
        }

        /* ─── Extra News Specific Styles ──────────────────────────────── */
        body.extra_news .masthead {
            background-color: transparent;
            border-bottom: none;
            padding: 0;
            margin-bottom: 5px;
            text-align: center;
        }

        body.extra_news .logo-img {
            max-width: 100%;
            max-height: 160px;
            display: inline-block;
        }

        body.extra_news .metadata-bar {
            display: flex;
            flex-direction: column;
            align-items: center;
            border-top: none;
            border-bottom: 1px solid var(--border-color);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: normal;
            color: #000;
            padding: 10px 0;
            margin-bottom: 15px;
        }

        body.extra_news .headline {
            background-color: transparent;
            color: var(--primary-color, #000000);
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            text-align: center;
            padding: 5px 0;
            margin-top: 10px;
            margin-bottom: 15px;
            font-size: 38px;
            line-height: 1.2;
        }

        body.extra_news .subtitle {
            font-family: 'Inter', sans-serif;
            font-weight: bold;
            font-size: 18px;
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            border-bottom: none;
            padding-bottom: 0;
        }

        /* Extra News Layout */
        .extra-news-layout {
            display: block;
            width: 100%;
        }

        .extra-image-wrapper {
            float: left;
            width: 45%;
            margin-right: 25px;
            margin-bottom: 15px;
            margin-top: 5px;
            text-align: center;
        }

        .extra-img {
            display: inline-block;
            max-width: 100%;
            max-height: 350px;
            width: auto;
            height: auto;
            object-fit: contain;
            border: 1px solid #ccc;
            padding: 4px;
            box-sizing: border-box;
            margin-bottom: 10px;
        }

        .extra-image-wrapper.multi-img {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .extra-image-wrapper.multi-img .extra-img {
            margin-bottom: 0;
            max-height: 160px;
        }

        .extra-image-wrapper.multi-img .extra-img.featured-top {
            grid-column: span 2;
            max-height: 200px;
        }

        .extra-paragraph {
            text-align: justify;
            margin-bottom: 8px;
            line-height: 1.45;
            font-size: 16px;
        }

        <script>
        // ── window.onerror: Report JS errors with exact file/line/column ────
        window.onerror = function(msg, src, line, col, err) {
            console.error(
                'JS ERROR:', msg,
                'FILE:', src,
                'LINE:', line,
                'COLUMN:', col
            );
            if (!window.__LAYOUT_DONE__) {
                window.__LAYOUT_DONE__ = true;
            }
            return false;
        };
        
        async function startCompositorLayout() {
            try {
                const dataEl = document.getElementById('newspaper-data');
                if (dataEl) {
                    window.NEWSPAPER_DATA = JSON.parse(dataEl.textContent);
                }
            } catch (e) {
                console.error('[LAYOUT] JSON Parse Error:', e);
            }
            const data = window.NEWSPAPER_DATA;
            if (!data) {
                console.error('[LAYOUT] No data found.');
                window.__LAYOUT_DONE__ = true;
                return;
            }

            const container = document.querySelector('.newspaper-container');
            if (!container) return;

            const totalChars = (data.sections || []).reduce((s, p) => s + p.length, 0);
            console.log('[LAYOUT] Article length:', totalChars, 'chars,', (data.sections||[]).length, 'sections');

            // waitReady utility with timeout
            async function waitReady() {
                const WAIT_TIMEOUT = 800;
                try {
                    await Promise.race([
                        document.fonts ? document.fonts.ready : Promise.resolve(),
                        new Promise(r => setTimeout(r, WAIT_TIMEOUT))
                    ]);
                } catch(e) {}

                const imgPromises = Array.from(document.images).map(img => {
                    if (img.complete || !img.src || !img.src.startsWith('http')) return Promise.resolve();
                    return Promise.race([
                        new Promise(r => {
                            img.onload = r;
                            img.onerror = r;
                        }),
                        new Promise(r => setTimeout(r, WAIT_TIMEOUT))
                    ]);
                });
                await Promise.all(imgPromises);
            }

            const TARGET_MAX_HEIGHT = 1600;
            const urls = data.image_urls || [];
            const captions = data.image_captions || [];
            const imgCount = urls.length;
            
            let aspectRatios = [];
            let orientations = [];

            // getImageDimensions utility
            async function getImageDimensions(url) {
                if (!url) return { width: 800, height: 600 };
                const existingImg = Array.from(document.images).find(img => img.src === url || img.getAttribute('src') === url);
                if (existingImg && existingImg.naturalWidth && existingImg.naturalHeight) {
                    return { width: existingImg.naturalWidth, height: existingImg.naturalHeight };
                }
                return new Promise((resolve) => {
                    const img = new Image();
                    img.onload = () => resolve({ width: img.naturalWidth || 800, height: img.naturalHeight || 600 });
                    img.onerror = () => resolve({ width: 800, height: 600 });
                    img.src = url;
                    if (img.complete && img.naturalWidth) {
                        resolve({ width: img.naturalWidth, height: img.naturalHeight });
                    }
                });
            }

            // Ensure we have a compositor-canvas element
            let canvas = document.getElementById('compositor-canvas');
            if (!canvas) {
                canvas = document.createElement('div');
                canvas.id = 'compositor-canvas';
                container.appendChild(canvas);
            }
            canvas.style.position = 'relative';
            canvas.style.width = '100%';
            canvas.style.boxSizing = 'border-box';

            else if (langStr.includes('kannada') || langStr === 'kn') langKey = 'kn';
            else if (langStr.includes('tamil') || langStr === 'ta') langKey = 'ta';
            else if (langStr.includes('malayalam') || langStr === 'ml') langKey = 'ml';

            let sumLabels = { 'te': 'సారాంశం', 'hi': 'सारांश', 'kn': 'ಸಾರಾಂಶ', 'ta': 'சுருக்கம்', 'ml': 'സംഗ్రహం', 'en': 'SUMMARY' };
            let bulLabels = { 'te': 'ముఖ్య అంశాలు', 'hi': 'मुख्य बिंदु', 'kn': 'ಪ್ರಮುಖ ಮುಖ್ಯಾంశాలు', 'ta': 'முக்கிய அம்சங்கள்', 'ml': 'ప్రధాన వివరాలు', 'en': 'KEY TAKEAWAYS' };

            let sumTitle = sumLabels[langKey] || 'SUMMARY';
            let bulTitle = bulLabels[langKey] || 'KEY TAKEAWAYS';

            function resolveColumns(colVal, charLen) {
                const s = String(colVal === undefined || colVal === null ? "auto" : colVal).toLowerCase().trim();
                const p = parseInt(s);
                if (!isNaN(p) && p >= 1 && p <= 4 && s !== "0" && s !== "auto") {
                    return p;
                }
                const rawLayout = String(data.image_layout || "default").toLowerCase().replace(/[^a-z]/g, "");
                if (rawLayout.includes('patternd')) {
                    return 3;
                }
                const isSingleSideLayout = (urls.length === 1) && (rawLayout.includes('patterna') || (!rawLayout.includes('patternb') && !rawLayout.includes('patternd') && !rawLayout.includes('single') && !rawLayout.includes('hero') && !rawLayout.includes('patternc') && !rawLayout.includes('patterng')));
                if (isSingleSideLayout) {
                    return 2;
                }
                if (charLen < 800) {
                    return 2;
                }
                return 3;
            }

            function getObstacles(W_canvas, S_img, imgHeightPx, H_canvas) {
                H_canvas = H_canvas || 1200;
                const TARGET_MAX_HEIGHT = H_canvas;
                const obstacles = [];
                const templateIdStr = String(data.template_id || "").toLowerCase().replace(/[^a-z0-9]/g, "");
                const logoIdStr = String(data.logo_id || "").toLowerCase().replace(/[^a-z0-9]/g, "");
                const rawLayout = String(data.image_layout || "default").toLowerCase().replace(/[^a-z]/g, "");
                const showSummaryFlag = data.show_summary === true || String(data.show_summary).toLowerCase() === "true";
                const isCustom = (templateIdStr.includes("custom") || logoIdStr.includes("custom")) && showSummaryFlag;
                const showSummary = isCustom && data.show_summary !== false && String(data.show_summary).toLowerCase() !== "false";

                if (urls.length > 0) {
                    const aspect0 = (aspectRatios && aspectRatios.length > 0 && aspectRatios[0]) ? aspectRatios[0] : 1.33;
                    let S_scale = S_img;
                    let gap = 60;
                    // Dynamically rescale images based on text content size to prevent overflowing short articles
                    if (totalChars > 0 && totalChars < 3000) {
                        const scaleFactor = Math.max(0.5, 1.0 - (3000 - totalChars) / 3500);
                        S_scale = S_img * scaleFactor;
                        gap = 30;
                    }
                    // Bulletproof pattern matching: handles "Pattern B", "pattern_b", "patternB", etc.
                    const isArticleStyle = rawLayout.includes('articlestyle');
                    let isPatternB = rawLayout.includes('patternb') || rawLayout.includes('patterna') || rawLayout.includes('patternd') || rawLayout.includes('patternc') || rawLayout.includes('patterne') || isArticleStyle || isCustom;
                    const isSinglePatternC = !isCustom && rawLayout.includes('patternc') && urls.length === 1;
                    const isSinglePatternA = !isCustom && rawLayout.includes('patterna') && urls.length === 1;
                    if (isSinglePatternC || isSinglePatternA) {
                        isPatternB = false;
                    }
                    if (isCustom || rawLayout === "default" || rawLayout === "" || rawLayout === "auto") {
                        isPatternB = true;
                    }
                    const isDoublePatternB = (isPatternB && urls.length === 2) && (rawLayout.includes('patternc') || rawLayout.includes('patterna') || rawLayout === "default");
                    const isTriplePatternB = isPatternB && urls.length >= 3;

                    const isSingleLeft75 = (urls.length === 1) && (rawLayout.includes('patterng') || rawLayout.includes('left75') || rawLayout.includes('pattern75') || rawLayout.includes('75left') || rawLayout.includes('75'));
                    
                    if (isSingleLeft75) {
                        // Single image: Left side covering ~58% width, dynamic height based on text content
                        let w0 = Math.round(W_canvas * 0.58);
                        let cap0 = String(captions[0] || '').trim();
                        let capAllowance0 = cap0 ? Math.ceil(cap0.length / Math.max(1, Math.floor(w0 / 6.5))) * 15 + 8 : 0;
                        
                        let h0;

                            h0 = Math.max(200, H_canvas - capAllowance0);

                            h0 = Math.max(300, Math.round(H_canvas * 0.72));

                        obstacles.push({
                            url: urls[0],

                            y: 0,
                            w: w0,
                            h: Math.round(h0 + capAllowance0),
                            imgH: Math.round(h0),

                            visW: w0,
                            objectFit: 'contain',
                            objectPosition: 'center center'
                        });
                    } else if (rawLayout.includes('patterng')) {
                        // Pattern G ALWAYS forces a horizontal gallery of ALL images at the top!
                        let count = urls.length;
                        if (count > 0) {
                            let gap = 16;
                            let w = (W_canvas - (gap * (count - 1))) / count;

                            for (let i = 0; i < count; i++) {
                                let asp = aspectRatios[i] || 1.0;
                                let thisH = w / asp;
                                if (thisH > maxH) maxH = thisH;
                            }
                            
                            // Cap height to prevent insanely tall images if they are vertical
                            if (maxH > W_canvas * 0.75) maxH = W_canvas * 0.75;
                            
                            for (let i = 0; i < count; i++) {
                                obstacles.push({ url: urls[i], caption: captions[i] || '', x: Math.round(i * (w + gap)), y: 0, w: Math.round(w), h: Math.round(maxH), imgH: Math.round(maxH), objectFit: 'contain', objectPosition: 'center center' });
                            }
                        }

                        // PHOTO 2: Bottom-Right (Column 2)

                        let single_col_w = Math.round((W_canvas - (N_layout_cols - 1) * grid_gap) / N_layout_cols);
                        
                        let w0 = single_col_w;
                        let dynamicH0 = Math.round(w0 / aspect0);
                        let maxH0 = Math.round(Math.min(dynamicH0, Math.max(220, single_col_w * 0.82)));
                        let h0 = Math.max(160, maxH0);
                        let cap0 = String(captions[0] || '').trim();
                        let capAllowance0 = cap0 ? Math.ceil(cap0.length / Math.max(1, Math.floor(w0 / 6.5))) * 15 + 8 : 0;
                        let totalH0 = Math.round(h0 + capAllowance0);
                        
                        obstacles.push({
                            url: urls[0],
                            caption: captions[0] || '',
                            x: 0,
                            y: 0,
                            w: Math.round(w0),
                            h: Math.round(totalH0),
                            imgH: Math.round(h0),
                            isCentered: false,
                            visW: Math.round(w0),
                            objectFit: 'contain',
                            objectPosition: 'center center'
                        });

                        if (urls.length > 1) {
                            let aspect1 = aspectRatios[1] || 1.0;
                            let w1 = single_col_w;
                            let dynamicH1 = Math.round(w1 / aspect1);
                            let maxH1 = Math.round(Math.min(dynamicH1, Math.max(220, single_col_w * 0.82)));
