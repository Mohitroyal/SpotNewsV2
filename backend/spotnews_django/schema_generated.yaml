openapi: 3.0.3
info:
  title: SpotNews & RTI Express API
  version: 2.0.0
  description: Complete API Contracts for SpotNews / RTI Express backend services
    including Authentication, Clippings Generation, Social & Engagement (shares, comments,
    reporter stats), Newspaper Generator, Reporter Verification, and Notifications.
paths:
  /api/v1/auth/send-otp:
    post:
      tags:
      - Authentication & OTP
      summary: Send Phone OTP
      description: Sends an OTP via SMS or WhatsApp to the specified phone number
        via MSG91.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - phone
              properties:
                phone:
                  type: string
                  example: '+919876543210'
                  description: Phone number with country code
                channel:
                  type: string
                  enum:
                  - sms
                  - whatsapp
                  default: sms
                  description: Delivery channel
      responses:
        '200':
          description: OTP sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: OTP sent successfully
                  channel:
                    type: string
                    example: sms
        '400':
          description: Invalid phone number or parameters
        '500':
          description: Failed to send OTP via MSG91
      operationId: post_api_v1_auth_send_otp
  /api/v1/auth/verify-otp:
    post:
      tags:
      - Authentication & OTP
      summary: Verify OTP & Authenticate
      description: Verifies the 4 or 6 digit OTP. On success, creates or returns the
        user profile, session token, and registers device token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - phone
              - otp
              properties:
                phone:
                  type: string
                  example: '+919876543210'
                otp:
                  type: string
                  example: '1234'
                device_token:
                  type: string
                  description: FCM device token for push notifications
      responses:
        '200':
          description: Authenticated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  token:
                    type: string
                    example: jwt-or-session-token
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        example: usr_abc123
                      phone:
                        type: string
                        example: '+919876543210'
                      role:
                        type: string
                        example: reporter
                      name:
                        type: string
                        example: Ravi Kumar
        '400':
          description: Invalid or expired OTP
      operationId: post_api_v1_auth_verify_otp
  /api/v1/auth/resend-otp:
    post:
      tags:
      - Authentication & OTP
      summary: Resend OTP
      description: Triggers OTP resend for a given phone number.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - phone
              properties:
                phone:
                  type: string
                  example: '+919876543210'
                retrytype:
                  type: string
                  enum:
                  - text
                  - voice
                  default: text
      responses:
        '200':
          description: OTP resent successfully
      operationId: post_api_v1_auth_resend_otp
  /api/v1/auth/me:
    get:
      tags:
      - Authentication & OTP
      summary: Get Current User Profile
      description: Returns current logged in user details, role, district, and status.
      responses:
        '200':
          description: User profile details
        '401':
          description: Unauthenticated
      operationId: get_api_v1_auth_me
  /api/v1/auth/logout:
    post:
      tags:
      - Authentication & OTP
      summary: Logout
      description: Terminates current session token and unregisters device token.
      responses:
        '200':
          description: Logged out successfully
      operationId: post_api_v1_auth_logout
  /api/v1/generate:
    post:
      tags:
      - Clippings & Generation
      summary: Create Newspaper Clipping
      description: Generates a styled newspaper clipping graphic from article headline,
        content, image, district, and logo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - headline
              - content
              properties:
                headline:
                  type: string
                  example: చేగొండపల్లిలో అరుణకు జగదీశ్వరి మద్దతు
                content:
                  type: string
                  example: పోలవరం మండలం చేగొండపల్లి గ్రామ పంచాయతీ ఎన్నికల్లో...
                image_url:
                  type: string
                  format: uri
                  example: https://example.com/photo.jpg
                district:
                  type: string
                  example: Sri Sathya Sai
                category:
                  type: string
                  example: రాజకీయాలు
                reporter_name:
                  type: string
                  example: User 3939
                logo_id:
                  type: string
                  example: rti_express
          multipart/form-data:
            schema:
              type: object
              required:
              - headline
              - content
              properties:
                headline:
                  type: string
                content:
                  type: string
                image:
                  type: string
                  format: binary
                district:
                  type: string
                category:
                  type: string
      responses:
        '200':
          description: Clipping generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: clip_abc123
                  image_url:
                    type: string
                    example: https://rffrqokpnqoycpozrjuc.supabase.co/storage/v1/object/public/newscraft/clippings/clip_abc123.jpg
                  status:
                    type: string
                    example: completed
                  created_at:
                    type: string
                    format: date-time
        '400':
          description: Invalid input parameters
      operationId: post_api_v1_generate
    get:
      tags:
      - Clippings & Generation
      summary: List Generated Clippings
      description: Retrieves recent generated clippings with pagination, district
        filter, and status.
      parameters:
      - name: district
        in: query
        schema:
          type: string
        description: Filter by district
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
      responses:
        '200':
          description: List of clippings
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  results:
                    type: array
                    items:
                      type: object
      operationId: get_api_v1_generate
  /api/v1/generate/{clipping_id}:
    get:
      tags:
      - Clippings & Generation
      summary: Get Clipping Details & Status
      parameters:
      - name: clipping_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Clipping status and rendered media URL
        '404':
          description: Clipping not found
      operationId: get_api_v1_generate_clipping_id_
  /api/v1/uploads/image:
    post:
      tags:
      - Clippings & Generation
      summary: Upload Image
      description: Uploads raw photo to Supabase storage bucket and returns CDN public
        URL.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Image uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    example: https://rffrqokpnqoycpozrjuc.supabase.co/storage/v1/object/public/newscraft/uploads/img_123.jpg
      operationId: post_api_v1_uploads_image
  /api/v1/clippings/{clip_id}/share:
    post:
      tags:
      - Social & Engagement
      summary: Increment Clipping Share Count
      description: Atomically records a share event for the clipping and increments
        total share metric in Supabase.
      parameters:
      - name: clip_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Share recorded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  clip_id:
                    type: string
                  shares:
                    type: integer
                    example: 14
      operationId: post_api_v1_clippings_clip_id_share
  /api/v1/reporter/follow:
    post:
      tags:
      - Social & Engagement
      summary: Follow / Unfollow Reporter
      description: Toggles or updates follower relationship between the authenticated
        user and a news reporter.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - reporter_id
              - user_id
              properties:
                reporter_id:
                  type: string
                  example: rep_789
                user_id:
                  type: string
                  example: usr_456
                action:
                  type: string
                  enum:
                  - follow
                  - unfollow
                  - toggle
                  default: toggle
      responses:
        '200':
          description: Follower state updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  is_following:
                    type: boolean
                    example: true
                  followers_count:
                    type: integer
                    example: 128
      operationId: post_api_v1_reporter_follow
  /api/v1/reporter/{reporter_id}/stats:
    get:
      tags:
      - Social & Engagement
      summary: Get Reporter Statistics
      description: 'Fetches aggregated engagement stats for a reporter: total views,
        comments, likes, shares, followers, and redeem balance.'
      parameters:
      - name: reporter_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Reporter statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  reporter_id:
                    type: string
                  views:
                    type: integer
                    example: 4520
                  likes:
                    type: integer
                    example: 320
                  comments:
                    type: integer
                    example: 89
                  shares:
                    type: integer
                    example: 142
                  followers:
                    type: integer
                    example: 78
                  redeem_points:
                    type: number
                    example: 450.0
      operationId: get_api_v1_reporter_reporter_id_stats
  /api/v1/clippings/{clip_id}/comments:
    get:
      tags:
      - Social & Engagement
      summary: Get Comments on Clipping
      parameters:
      - name: clip_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: List of comments
          content:
            application/json:
              schema:
                type: object
                properties:
                  comments:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        user_id:
                          type: string
                        user_name:
                          type: string
                        comment:
                          type: string
                        created_at:
                          type: string
                          format: date-time
      operationId: get_api_v1_clippings_clip_id_comments
    post:
      tags:
      - Social & Engagement
      summary: Add Comment to Clipping
      parameters:
      - name: clip_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - user_id
              - comment
              properties:
                user_id:
                  type: string
                  example: usr_123
                user_name:
                  type: string
                  example: Venkatesh
                comment:
                  type: string
                  example: చాలా మంచి వార్త!
      responses:
        '201':
          description: Comment added successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  comment_id:
                    type: string
      operationId: post_api_v1_clippings_clip_id_comments
  /n/{clip_id}:
    get:
      tags:
      - Social & Engagement
      summary: Rich Card Preview & App Intent Launcher
      description: Way2News-style dynamic OpenGraph HTML card that automatically triggers
        the SpotNews Android App intent (`spotnews://clipping/{id}`) or displays rich
        web preview if not installed.
      parameters:
      - name: clip_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: HTML page with OpenGraph metadata and Android App intent redirect
          content:
            text/html: {}
      operationId: get_n_clip_id_
  /api/v1/admin/daily-newspaper/clippings:
    get:
      tags:
      - Daily Newspaper (EPaper)
      summary: Get Eligible Clippings for Newspaper Edition
      description: Fetches verified published clippings eligible for daily broadsheet
        newspaper generation.
      parameters:
      - name: date
        in: query
        schema:
          type: string
          format: date
        description: Date YYYY-MM-DD
      - name: district
        in: query
        schema:
          type: string
      responses:
        '200':
          description: List of clippings eligible for inclusion
      operationId: get_api_v1_admin_daily_newspaper_clippings
  /api/v1/admin/daily-newspaper/preview:
    post:
      tags:
      - Daily Newspaper (EPaper)
      summary: Preview Daily Newspaper HTML Layout
      description: Generates a real-time HTML preview of the RTI Express multi-page
        broadsheet newspaper without compiling to PDF.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                edition_date:
                  type: string
                  example: '2026-11-23'
                selected_clipping_ids:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Preview HTML generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  html:
                    type: string
                  page_count:
                    type: integer
      operationId: post_api_v1_admin_daily_newspaper_preview
  /api/v1/admin/daily-newspaper/generate:
    post:
      tags:
      - Daily Newspaper (EPaper)
      summary: Compile & Generate Broadsheet Newspaper PDF
      description: Compiles the immutable RTI Express broadsheet layout into a high-resolution,
        print-ready PDF and stores it in Supabase.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                edition_date:
                  type: string
                  example: '2026-11-23'
                selected_clipping_ids:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: PDF generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  pdf_url:
                    type: string
                    format: uri
                  edition_id:
                    type: string
                  filename:
                    type: string
                  page_count:
                    type: integer
      operationId: post_api_v1_admin_daily_newspaper_generate
  /api/v1/admin/daily-newspaper/editions:
    get:
      tags:
      - Daily Newspaper (EPaper)
      summary: List Generated Newspaper Editions
      responses:
        '200':
          description: List of past PDF editions with dates and download links
      operationId: get_api_v1_admin_daily_newspaper_editions
  /api/editions/{filename}:
    get:
      tags:
      - Daily Newspaper (EPaper)
      summary: Serve Newspaper Edition PDF
      parameters:
      - name: filename
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Binary PDF file stream
          content:
            application/pdf: {}
      operationId: get_api_editions_filename_
  /api/v1/reporter/payment/config:
    get:
      tags:
      - Reporter Payments & Verification
      summary: Get Razorpay Payment Configuration
      description: Returns public Razorpay Key ID and subscription fee amount for
        reporter ID card & verification.
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  key_id:
                    type: string
                    example: rzp_live_abc123
                  amount:
                    type: integer
                    example: 99900
                    description: Amount in paise (999.00 INR)
                  currency:
                    type: string
                    example: INR
      operationId: get_api_v1_reporter_payment_config
  /api/v1/reporter/payment/create-order:
    post:
      tags:
      - Reporter Payments & Verification
      summary: Create Razorpay Order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - user_id
              properties:
                user_id:
                  type: string
                amount:
                  type: integer
                  default: 99900
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  order_id:
                    type: string
                    example: order_EKfLwpZbfSCaqK
                  amount:
                    type: integer
                  currency:
                    type: string
      operationId: post_api_v1_reporter_payment_create_order
  /api/v1/reporter/payment/verify:
    post:
      tags:
      - Reporter Payments & Verification
      summary: Verify Razorpay Payment Signature
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - razorpay_order_id
              - razorpay_payment_id
              - razorpay_signature
              properties:
                razorpay_order_id:
                  type: string
                razorpay_payment_id:
                  type: string
                razorpay_signature:
                  type: string
                user_id:
                  type: string
      responses:
        '200':
          description: Payment verified and reporter status activated
      operationId: post_api_v1_reporter_payment_verify
  /api/v1/reporter/payment/status:
    get:
      tags:
      - Reporter Payments & Verification
      summary: Check Reporter Verification Status
      parameters:
      - name: user_id
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  verified:
                    type: boolean
                  payment_status:
                    type: string
                  reporter_card_url:
                    type: string
      operationId: get_api_v1_reporter_payment_status
  /api/v1/reporter/send-approval-sms:
    post:
      tags:
      - Reporter Payments & Verification
      summary: Send Reporter Approval Notification SMS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - phone
              properties:
                phone:
                  type: string
                reporter_name:
                  type: string
      responses:
        '200':
          description: Approval SMS dispatched via MSG91
      operationId: post_api_v1_reporter_send_approval_sms
  /api/v1/admin/stats:
    get:
      tags:
      - Admin Operations
      summary: Get Admin Overview Statistics
      description: Returns counts of users, active reporters, total clippings, today's
        views, shares, and pending verifications.
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_users:
                    type: integer
                  total_reporters:
                    type: integer
                  total_clippings:
                    type: integer
                  today_views:
                    type: integer
                  today_shares:
                    type: integer
      operationId: get_api_v1_admin_stats
  /api/v1/admin/auth-users:
    get:
      tags:
      - Admin Operations
      summary: List All Registered Users
      parameters:
      - name: role
        in: query
        schema:
          type: string
      - name: search
        in: query
        schema:
          type: string
      responses:
        '200':
          description: List of user accounts
      operationId: get_api_v1_admin_auth_users
  /api/v1/admin/users/{user_id}/role:
    post:
      tags:
      - Admin Operations
      summary: Change User Role
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - role
              properties:
                role:
                  type: string
                  enum:
                  - user
                  - reporter
                  - editor
                  - admin
      responses:
        '200':
          description: Role updated successfully
      operationId: post_api_v1_admin_users_user_id_role
  /api/v1/admin/users/{user_id}/ban:
    post:
      tags:
      - Admin Operations
      summary: Ban / Unban User
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: User ban status toggled
      operationId: post_api_v1_admin_users_user_id_ban
  /api/v1/admin/users/{user_id}:
    delete:
      tags:
      - Admin Operations
      summary: Delete User Account
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: User permanently deleted
      operationId: delete_api_v1_admin_users_user_id_
  /api/v1/admin/logos:
    get:
      tags:
      - Admin Operations
      summary: List All Publication Logos
      responses:
        '200':
          description: List of publication logos (RTI Express, etc.)
      operationId: get_api_v1_admin_logos
  /api/v1/admin/logos/active:
    get:
      tags:
      - Admin Operations
      summary: Get Active Publication Logo
      responses:
        '200':
          description: Active publication logo metadata and image URL
      operationId: get_api_v1_admin_logos_active
  /api/v1/admin/generations:
    get:
      tags:
      - Admin Operations
      summary: List Admin Generation History
      responses:
        '200':
          description: Recent image & clipping generations across all users
      operationId: get_api_v1_admin_generations
  /api/v1/notifications/send:
    post:
      tags:
      - Push Notifications
      summary: Send Push Notification via FCM HTTP v1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - title
              - body
              properties:
                title:
                  type: string
                  example: 'ముఖ్యమైన వార్త: RTI Express'
                body:
                  type: string
                  example: చేగొండపల్లి ఎన్నికల ప్రచారం వివరాలు చదవండి...
                district:
                  type: string
                  description: Target district or broadcast to all
                clipping_id:
                  type: string
                  description: ID to open when notification is clicked
      responses:
        '200':
          description: Notification broadcast initiated
      operationId: post_api_v1_notifications_send
  /api/v1/notifications/process-events:
    post:
      tags:
      - Push Notifications
      summary: Process Notification Event Queue
      responses:
        '200':
          description: Notification events processed successfully
      operationId: post_api_v1_notifications_process_events
  /api/v1/notifications/tokens:
    get:
      tags:
      - Push Notifications
      summary: Get Registered Device Tokens Count
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_devices:
                    type: integer
                  active_last_24h:
                    type: integer
      operationId: get_api_v1_notifications_tokens
  /health:
    get:
      tags:
      - Health & System
      summary: Server Health Check
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  timestamp:
                    type: string
                    format: date-time
      operationId: get_health
  /health/msg91:
    get:
      tags:
      - Health & System
      summary: MSG91 SMS Gateway Health Check
      responses:
        '200':
          description: MSG91 credentials and connectivity verified
      operationId: get_health_msg91
  /.well-known/assetlinks.json:
    get:
      tags:
      - Health & System
      summary: Android App Links Digital Asset Links
      description: Serves Android App Links verification JSON for seamless deep linking
        into the SpotNews app without disambiguation dialogs.
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
      operationId: get__well_known_assetlinks_json
  /auth/login/:
    get:
      tags:
      - Accounts & Web Auth
      summary: Render Web Login Page
      responses:
        '200':
          description: HTML login page
      operationId: get_auth_login
    post:
      tags:
      - Accounts & Web Auth
      summary: Authenticate User via Username/Password
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - username
              - password
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        '302':
          description: Redirect on successful login
        '200':
          description: Re-rendered form on error
      operationId: post_auth_login
  /auth/logout/:
    get:
      tags:
      - Accounts & Web Auth
      summary: Web Session Logout
      responses:
        '302':
          description: Redirect to login page
      operationId: get_auth_logout
  /dashboard/:
    get:
      tags:
      - Dashboard Web Views
      summary: Admin Dashboard Main Panel
      security:
      - SessionAuth: []
      responses:
        '200':
          description: HTML dashboard view
      operationId: get_dashboard
  /dashboard/clippings/:
    get:
      tags:
      - Dashboard Web Views
      summary: Clipping Moderation Table
      security:
      - SessionAuth: []
      responses:
        '200':
          description: HTML clippings table view
      operationId: get_dashboard_clippings
  /dashboard/users/:
    get:
      tags:
      - Dashboard Web Views
      summary: User Management Table
      security:
      - SessionAuth: []
      responses:
        '200':
          description: HTML user management table view
      operationId: get_dashboard_users
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Provide user session or JWT token in header: Authorization: Bearer
        <token>'
    SessionAuth:
      type: apiKey
      in: cookie
      name: sessionid
      description: Standard Django session cookie authentication
